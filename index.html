const app=document.getElementById("app"),bar=document.querySelector("#bar i"),cnt=document.getElementById("cnt");
let i=0,tok=0;
function render(n){
  i=Math.max(0,Math.min(S.length-1,n));const d=S[i];tok++;pick={};const my=tok;
  let h=`<section class="paper"><div class="tab">ДЕЛО № ${String(i+1).padStart(3,"0")}</div><div class="stamp">${d.stamp}</div>${i==0?"<h1>"+d.h+"</h1>":"<h2>"+d.h+"</h2>"}<p class="sub">${d.sub}</p>`;
  if(d.t)h+=`<p>${d.t}</p>`;
  if(d.note)h+=`<div class="nw"><div class="note"><b>${d.note[0]}</b><i>нажмите, чтобы развернуть</i><span>${d.note[1]}</span></div></div>`;
  if(d.sort)h+=sortHTML();
  if(d.tb)h+=`<table class="tb">${d.tb.map((r,k)=>"<tr>"+r.map(c=>(k?"<td>":"<th>")+c+(k?"</td>":"</th>")).join("")+"</tr>").join("")}</table>`;
  if(d.c)h+=`<div class="ch"><p><b>${d.c[0]}</b></p>${d.c[1].map((o,k)=>`<button data-ch="${k}">${o[0]}</button>`).join("")}<p id="chr">Выберите вариант, чтобы увидеть последствия.</p></div>`;
  if(d.big)h+=`<div class="big">${d.big.map(b=>`<div><b>${b[0]}</b><span>${b[1]}</span></div>`).join("")}</div>`;
  if(d.list)h+=`<ul>${d.list.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(d.letter)h+=`<div class="letter" id="ty"></div>`;
  if(d.task)h+=`<div class="task"><h3>ЗАДАНИЕ КОМАНДАМ</h3><ul>${d.task.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  if(d.q)h+=`<div class="q">Вопрос расследования: ${d.q}</div>`;
  app.innerHTML=h+"</section>";
  window.scrollTo(0,0);try{decorate()}catch(e){console.error(e)}
  bar.style.width=((i+1)/S.length*100)+"%";cnt.textContent="ДЕЛО "+(i+1)+"/"+S.length;
  document.getElementById("prev").disabled=i==0;document.getElementById("next").disabled=i==S.length-1;
  const ty=document.getElementById("ty");
  if(ty){let k=0;const txt=d.letter;(function f(){if(my!=tok)return;k+=3;ty.textContent=txt.slice(0,k);if(k<txt.length)setTimeout(f,14);})();}
}
document.getElementById("next").onclick=()=>render(i+1);
document.getElementById("prev").onclick=()=>render(i-1);
addEventListener("keydown",e=>{if(e.key=="ArrowRight")render(i+1);if(e.key=="ArrowLeft")render(i-1)});
let sx=0;addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>80)render(i+(dx<0?1:-1))},{passive:true});

// ===== Музыка: три трека, склеенные в один (встроены в страницу) =====
let on=false,bgm=null,muted=false;
const mus=document.getElementById("mus");
function buildAudio(){
  if(bgm)return bgm;
  bgm=document.createElement("audio");
  bgm.src="music.mp3";bgm.loop=true;bgm.preload="auto";bgm.volume=.6;
  bgm.setAttribute("playsinline","");
  document.body.appendChild(bgm);
  return bgm;
}
async function startMusic(){
  muted=false;
  try{const a=buildAudio();await a.play();on=true;mus.textContent="♪ вкл"}
  catch(e){on=false;mus.textContent="♪ выкл"}
}
function stopMusic(){muted=true;if(bgm)bgm.pause();on=false;mus.textContent="♪ выкл"}
mus.onclick=()=>on?stopMusic():startMusic();
// если браузер не дал включить звук сразу — включаем при первом касании
addEventListener("pointerdown",()=>{if(!on&&!muted&&!document.getElementById("intro"))startMusic()},{passive:true});
document.addEventListener("visibilitychange",()=>{if(!bgm)return;if(document.hidden)bgm.pause();else if(on)bgm.play().catch(()=>{})});

// какой агент на каком слайде
const CH=[1,3,1,6,6,5,4,3,2,2,2,5,1,4,6,3,5,1,4,3,2,6,5,2,1];
const svgOf=n=>`<svg viewBox="0 0 100 100" width="100%" height="100%" overflow="visible"><g class="o">${ST[n]}</g><g>${ST[n]}</g></svg>`;
function rnd(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function add(par,n,s,css,rr){
  const d=document.createElement("div");d.className="st";
  d.style.cssText=`width:${s}px;height:${s}px;${css};--r:${Math.round(rr()*16-8)}deg;--d:${(4+rr()*3).toFixed(1)}s`;
  d.innerHTML=svgOf(n);par.appendChild(d);
}
const scale=()=>innerWidth>=1100?1.5:innerWidth<640?.85:1;
function decorate(){
  const paper=app.querySelector(".paper");if(!paper)return;
  const rr=rnd(i*977+13),s=Math.round(96*scale()),side=i%2?`left:${(3+rr()*14).toFixed(1)}%`:`right:${(3+rr()*14).toFixed(1)}%`;
  add(paper,"a"+(CH[i]||1),s,`bottom:${(-s*.68).toFixed(0)}px;${side}`,rr);
}
try{
  // падающие звёздочки и сердечки на заднем плане
  const rain=document.createElement("div");rain.id="rain";document.body.prepend(rain);
  const rr=rnd(777),list=["star","heart","spark"],cnt=innerWidth<640?8:12;
  for(let n=0;n<cnt;n++){
    const d=document.createElement("div"),s=Math.round(20+rr()*18);d.className="rn";
    d.style.cssText=`left:${(rr()*100).toFixed(1)}vw;width:${s}px;height:${s}px;--d:${(14+rr()*16).toFixed(1)}s;--dl:-${(rr()*24).toFixed(1)}s;--sw:${Math.round(rr()*120-60)}px`;
    d.innerHTML=svgOf(list[n%3]);rain.appendChild(d);
  }
  // два агента на заставке
  const intro=document.getElementById("intro"),s=Math.round(130*scale());
  add(intro,"a1",s,`left:4%;bottom:${(-s*.3).toFixed(0)}px`,rnd(3));
  add(intro,"a3",s,`right:4%;bottom:${(-s*.3).toFixed(0)}px`,rnd(4));
}catch(e){console.error(e)}

let pick={};
const CARDS=[["Токарный станок","F"],["Металлические листы","W"],["Погрузчик","F"],["Запасные детали","W"],["Производственное здание","F"],["Готовая продукция","W"],["Инструмент длительного использования","F"],["Топливо","W"],["Станок № 17 (по документам)","F"]];
function sortHTML(){return `<div class="cards">`+CARDS.map((c,k)=>`<div class="cd" id="c${k}" style="--r:${(k%3-1)*.8}deg"><b>${c[0]}</b><div><button data-k="${k}" data-v="F">Основные</button><button data-k="${k}" data-v="W">Оборотные</button></div></div>`).join("")+`</div><button id="chk" class="chk">ПРОВЕРИТЬ ДОСЬЕ</button><p id="res"></p>`}
app.addEventListener("click",e=>{const t=e.target;
  if(t.classList.contains("red-act"))t.classList.toggle("on");
  if(t.dataset&&t.dataset.ch!==undefined){const o=S[i].c[1][t.dataset.ch];[...t.parentNode.querySelectorAll("button")].forEach(b=>b.classList.toggle("on",b==t));document.getElementById("chr").innerHTML=o[1]}
  const n=t.closest(".note");if(n)n.classList.add("open");
  if(t.dataset&&t.dataset.v){pick[t.dataset.k]=t.dataset.v;[...t.parentNode.children].forEach(b=>b.classList.toggle("on",b==t))}
  if(t.id=="chk"){let r=0;CARDS.forEach((c,k)=>{const el=document.getElementById("c"+k);el.classList.remove("ok","bad");if(pick[k]){const g=pick[k]==c[1];r+=g;el.classList.add(g?"ok":"bad");el.dataset.m=g?"✓ ":"✕ "}});
    document.getElementById("res").innerHTML="Верно: <b>"+r+" из "+CARDS.length+"</b>. Но посмотрите на последнюю карточку: станок № 17 по документам стоит в цехе № 2, а сотрудники его не видели. Это первая зацепка."}
});
